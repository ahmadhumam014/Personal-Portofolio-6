<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <title>Personal Portofolio</title>
</head>
<body>
    <nav>
        <div class="logo" data-aos="zoom-in" data-aos-duration="1000">
            <h2>Ahmad<span>Humam</span></h2>
        </div>
        <div class="links" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
            <ul>
                <li data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100"><a href="#">Home</a></li>
                <li data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200"><a href="#">About</a></li>
                <li data-aos="fade-up" data-aos-duration="1000" data-aos-delay="300"><a href="#">Work</a></li>
                <li data-aos="fade-up" data-aos-duration="1000" data-aos-delay="400"><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>
    <div class="main">
        <img class="men" src="main.png" data-aos="zoom-in" data-aos-duration="1500" data-aos-delay="100">
        <div class="main-detail">
            <p data-aos="fade-left" data-aos-duration="1500" data-aos-delay="100">Hello I'm</p>
            <h1 data-aos="zoom-in" data-aos-duration="1500" data-aos-delay="200">Ahmad Humam</h1>
            <h4 data-aos="flip-up" data-aos-duration="1500" data-aos-delay="300">FrontEnd Developer</h4>

            <div class="btn">
                <button class="btn-1" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="100">Download CV</button>
                <button class="btn-2" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="100">Hire Me</button>
            </div>

            <div class="social">
                <i class="fa-brands fa-github" data-aos="fade-right" data-aos-duration="1500" data-aos-delay="200"></i>
                <i class="fa-brands fa-instagram" data-aos="fade-left" data-aos-duration="1500" data-aos-delay="200"></i>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
    AOS.init();
  </script>
</body>
</html>
